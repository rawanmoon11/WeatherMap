<!doctype html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1.0">

    <title> Weather Map</title>

    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
        integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poltawski+Nowy:ital,wght@0,400..700;1,400..700&display=swap"
        rel="stylesheet">
    <link href="style.css" rel="stylesheet">

</head>


<body>
    <header>
    <h1>  Weather Map</h1>
</header>
    <main>
        <form id="Search_city">
            <label for="city"> please Enter Location</label>
            <input id="city" type="text" placeholder="Search for a location" required>
            <button id="getWeather" type="submit"> Get Weather</button>
        </form>
        <div class="map_container">

            <div id="err_box" class="alert-card hidden"></div>
            <div id="load" class="hidden"></div>
            <div id="map">


            </div>
        </div>


    </main>
    <script src="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="javascript.js" defer></script>


</body>

</html>
